[mypy]
python_version = 3.11
# no_strict_optional = True
namespace_packages = True
ignore_missing_imports = True
exclude = src/mdaviz/synApps_mdalib/.*,src/__init__.py

# Workaround: recent PyQt6 releases ship .pyi stubs that mypy rejects as
# syntactically invalid ("/ must be ahead of *"). The error aborts the run
# before any mdaviz code is checked. Per-module ignore_errors and
# follow_imports do not help -- it fails at parse time, before those apply.
# Not reading site-packages stubs sidesteps it; third-party types become Any,
# which ignore_missing_imports above already largely assumed. Remove this once
# PyQt6's stubs parse again, to get Qt and numpy call checking back.
no_site_packages = True

[mypy-PyQt6.*]
ignore_missing_imports = True

# Needed because no_site_packages hides the installed types-PyYAML stubs
[mypy-yaml.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-lmfit.*]
ignore_missing_imports = True

[mypy-mdaviz.synApps_mdalib.*]
ignore_missing_imports = True

[mypy-setuptools_scm.*]
ignore_missing_imports = True
