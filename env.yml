name: mdaviz

# NOTE: this file is no longer the recommended way to set up mdaviz.
# All dependencies are declared in pyproject.toml; prefer:
#
#   conda create -n mdaviz python=3.12
#   conda activate mdaviz
#   pip install -e ".[dev]"
#
# This file is kept for anyone who prefers conda-forge builds of the
# scientific stack. It covers runtime dependencies only -- it does NOT
# install pytest, ruff, mypy or pre-commit, so follow it with
# `pip install -e ".[dev]"` if you intend to run the tests.
#
# conda env create -n mdaviz -f ./env.yml --solver=libmamba

channels:
  - conda-forge
  - nodefaults

dependencies:
  - libopenblas
  - matplotlib
  - scipy
  - lmfit
  - pyyaml
  - psutil

  # rely on pip to install PyQt6 and its dependencies
  - pip
  - pip:
    - PyQt6
